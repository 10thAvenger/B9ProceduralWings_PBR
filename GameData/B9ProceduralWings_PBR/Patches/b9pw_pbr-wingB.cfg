@PART[B9_Aero_Wing_Procedural_TypeB]:NEEDS[B9_Aerospace_ProceduralWings&Technicolor]:FOR[B9ProceduralWings_PBR]
{
	!MODEL {}
	MODEL
	{
		model = B9ProceduralWings_PBR/Assets/B9PW_PBR_wingB
	}
	
	!MODULE[WingProcedural] {}
	MODULE
    {
        name = WingProceduralShabby
        isCtrlSrf = True
        isWingAsCtrlSrf = False
		defaultUpDownVariant = Base
    }

    SHABBY_MATERIAL_REPLACE
	{
		materialDef = b9pw_surface_tc
		targetTransform = surface1
		targetTransform = surface2
	}
    SHABBY_MATERIAL_REPLACE
	{
		materialDef = b9pw_tiles_tc
		targetTransform = surface1Tiled
		targetTransform = surface2Tiled
	}
	SHABBY_MATERIAL_REPLACE
	{
		materialDef = b9pw_edges_tc
		targetTransform = frame
		targetTransform = edge_type0
		targetTransform = edge_type1
		targetTransform = edge_type2
	}

    MODULE
    {
        name = ModulePartVariants
        useMultipleDragCubes = false
        baseVariant = Base
        VARIANT
        {
            name = Base
            displayName = #LOC_B9PW-PBR_variant_bare
            primaryColor = #ffffff
        }
        VARIANT
        {
            name = TilesBottom
            displayName = #LOC_B9PW-PBR_variant_tiled-bottom
            primaryColor = #ffffff
            secondaryColor = #000000
        }
        VARIANT
        {
            name = TilesTop
            displayName = #LOC_B9PW-PBR_variant_tiled-top
            primaryColor = #000000
            secondaryColor = #ffffff
        }
        VARIANT
        {
            name = Tiles
            displayName = #LOC_B9PW-PBR_variant_tiled
            primaryColor = #000000
            secondaryColor = #000000
        }
    }

	MODULE
    {
        name = ModuleTechnicolor

        COLORZONE
        {
			name = main
			swatchPrimary = porkjetWhite
			swatchSecondary = porkjetBlack
			transform = surface1
			transform = surface2
			transform = edge_type0
			transform = edge_type1
			transform = edge_type2
        }

		COLORZONE
		{
			name = tiles
			swatchPrimary = tileBlack
			swatchSecondary = blank
			transform = surface1Tiled
			transform = surface2Tiled
		}
    }
}